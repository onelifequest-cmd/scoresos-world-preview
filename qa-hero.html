<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>QA Lumea Hero — Score OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  html,body{margin:0;height:100%;background:#050a07;overflow:hidden}
  #lumea-hero-root{position:fixed;inset:0;width:100%;height:100%;z-index:1}
  #lumea-hero-root canvas{display:block;width:100%!important;height:100%!important}
  .hero-depth{position:fixed;inset:0;z-index:2;pointer-events:none;display:grid;
    grid-template-columns:1.15fr 0.85fr;align-items:center;padding:10vh 7vw 20vh;gap:2vw}
  .hero-headline-behind{
    margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;
    font-size:clamp(3.6rem,10.5vw,8rem);letter-spacing:-0.04em;line-height:0.9;
    color:rgba(242,234,214,0.92);max-width:9ch;
    transform:translateY(0.5vh);
    text-shadow:0 2px 40px rgba(0,0,0,0.55);
  }
  .hero-headline-behind .hn-score{display:block;font-style:normal}
  .hero-headline-behind .hn-os{display:inline-block;letter-spacing:-0.035em}
  .hero-aside{
    justify-self:end;align-self:center;max-width:24ch;margin:0;
    padding-left:1.35rem;border-left:1px solid rgba(212,175,55,0.32);
    font-family:Inter,system-ui,sans-serif;font-size:clamp(0.62rem,1.05vw,0.78rem);
    font-weight:500;letter-spacing:0.2em;line-height:1.6;text-transform:uppercase;
    color:rgba(210,200,175,0.52);transform:translateY(-2vh);
  }
</style>
</head>
<body>
<div id="lumea-hero-root"></div>
<div class="hero-depth" aria-hidden="true">
  <p class="hero-headline-behind"><span class="hn-score">Score</span> <span class="hn-os">OS</span></p>
  <p class="hero-aside">Motion, identity, and immersive credit repair. The tools serve the agency — the vision is yours.</p>
</div>
<script type="module" src="./hero-r3f/lumea-hero.js?v=v3g2"></script>
<script type="module">
  // Failsafe QA ready if prewarm stalls (swiftshader)
  const start = performance.now();
  const tick = () => {
    const root = document.getElementById('lumea-hero-root');
    if (root?.dataset.qa === 'ready' || document.documentElement.dataset.qa === 'ready') return;
    if (performance.now() - start > 12000) {
      document.documentElement.dataset.qa = 'ready';
      root && (root.dataset.qa = 'ready');
      return;
    }
    if (root?.dataset.qa === 'ready') {
      document.documentElement.dataset.qa = 'ready';
      return;
    }
    requestAnimationFrame(tick);
  };
  // Also watch MutationObserver
  const root = document.getElementById('lumea-hero-root');
  const mo = new MutationObserver(() => {
    if (root.dataset.qa === 'ready') document.documentElement.dataset.qa = 'ready';
  });
  mo.observe(root, { attributes: true });
  requestAnimationFrame(tick);
</script>
</body>
</html>
