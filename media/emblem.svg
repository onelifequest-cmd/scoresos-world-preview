<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <!-- Score OS gauge emblem — filled shapes for ExtrudeGeometry -->
  <circle id="jewel" cx="90" cy="78" r="12" fill="#F4D96B"/>
  <!-- outer ring as thick annulus via evenodd -->
  <path id="ring" fill="#D4AF37" fill-rule="evenodd" d="M90 30 A60 60 0 1 1 89.9 30 Z M90 42 A48 48 0 1 0 90.1 42 Z"/>
  <!-- score arc (thick) -->
